name: Deploy production (Supabase)

# Applies migrations and deploys all edge functions to the PRODUCTION
# Supabase project. Production deploys are always deliberate:
#   - manual trigger only (workflow_dispatch) — never on push
#   - a typed confirmation phrase
#   - CI must already be green on the exact commit being deployed
#   - the `production` GitHub environment can additionally require a
#     human approval (Settings → Environments → production → reviewers)
#
# Secrets are ENVIRONMENT-SCOPED: create the same names used by staging
# (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD,
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, VAULT_MASTER_KEY, APP_BASE_URL,
# RESEND_API_KEY, NOTIFY_FROM_EMAIL) inside the `production` environment,
# holding the PRODUCTION project's values. One-time setup lives in
# docs/dev/production-cutover.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-production" to confirm'
        required: true
        type: string
      sync_secrets:
        description: "Also push edge-function secrets from GitHub secrets"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Production gate
    runs-on: ubuntu-latest
    steps:
      - name: Require the confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "deploy-production" ]; then
            echo 'Refusing: type "deploy-production" in the confirm box to deploy.'
            exit 1
          fi

      - name: Require green CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "Refusing to deploy: CI for ${{ github.sha }} is '$conclusion' (need success)."
            echo "Push the commit, let CI finish green, then re-run this workflow."
            exit 1
          fi
          echo "CI green on ${{ github.sha }} — deploying to production."

  migrate:
    name: Apply migrations
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0 — keep in lockstep with deploy-staging.yml
        with:
          version: 2.109.1  # keep in lockstep with deploy-staging.yml

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Push migrations
        run: supabase db push

  deploy-functions:
    name: Deploy edge functions
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0 — keep in lockstep with deploy-staging.yml
        with:
          version: 2.109.1

      - name: Deploy all functions
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # The vault key must be able to read THIS project's data, and the place
      # to discover otherwise is here, not at a client's front door (B2).
      # Verifies the property rather than the bytes: it calls the function that
      # just deployed, which decrypts the canary with the key actually loaded
      # in the running isolate. A digest comparison of the secret would only
      # prove two strings match — not that the key was applied, not that the
      # function can reach it, and not that it opens this project's rows.
      #
      # On a project that has never stored a credential this installs the pin,
      # which can only ever bless the key the deployment is already using.
      - name: Verify the vault key opens this project
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SERVICE_KEY" ]; then
            echo "::warning title=Vault key not verified::SUPABASE_SERVICE_ROLE_KEY is not set for this environment, so the deployed vault key was not checked against the canary. See docs/dev/vault-key-rotation.md."
            exit 0
          fi
          body=$(curl -sS --fail-with-body -X POST \
            "https://$PROJECT_REF.supabase.co/functions/v1/vault-rekey" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"action":"verify"}' 2>&1) || {
              echo "$body"
              echo "::error title=The deployed vault key cannot read this project::vault-rekey/verify failed. If this says key_mismatch, VAULT_MASTER_KEY is not the key these credentials were encrypted with — do NOT re-run with a new key, and do not rewrap. Put the previous key back, or supply it as VAULT_MASTER_KEY_PREVIOUS. See docs/dev/vault-key-rotation.md."
              exit 1
            }
          # No secret is printed: the response carries a key id and counts only.
          echo "$body"

  sync-secrets:
    name: Sync edge secrets (opt-in)
    if: ${{ inputs.sync_secrets }}
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0 — keep in lockstep with deploy-staging.yml
        with:
          version: 2.109.1

      - name: Push edge-function secrets
        run: |
          args=()
          add() { if [ -n "$2" ]; then args+=("$1=$2"); else echo "skip: $1 not set"; fi; }
          add STRIPE_SECRET_KEY     "${{ secrets.STRIPE_SECRET_KEY }}"
          add STRIPE_WEBHOOK_SECRET "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          add VAULT_MASTER_KEY      "${{ secrets.VAULT_MASTER_KEY }}"
          add APP_BASE_URL          "${{ secrets.APP_BASE_URL }}"
          add RESEND_API_KEY        "${{ secrets.RESEND_API_KEY }}"
          add NOTIFY_FROM_EMAIL     "${{ secrets.NOTIFY_FROM_EMAIL }}"
          if [ ${#args[@]} -eq 0 ]; then echo "nothing to sync"; exit 0; fi
          supabase secrets set "${args[@]}" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
