name: Deploy production (Supabase)

# Applies migrations and deploys all edge functions to the PRODUCTION
# Supabase project. Production deploys are always deliberate:
#   - manual trigger only (workflow_dispatch) — never on push
#   - a typed confirmation phrase
#   - CI must already be green on the exact commit being deployed
#   - the `production` GitHub environment can additionally require a
#     human approval (Settings → Environments → production → reviewers)
#
# Secrets are ENVIRONMENT-SCOPED: create the same names used by staging
# (SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF, SUPABASE_DB_PASSWORD,
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, VAULT_MASTER_KEY, APP_BASE_URL,
# RESEND_API_KEY, NOTIFY_FROM_EMAIL) inside the `production` environment,
# holding the PRODUCTION project's values. One-time setup lives in
# docs/dev/production-cutover.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy-production" to confirm'
        required: true
        type: string
      sync_secrets:
        description: "Also push edge-function secrets from GitHub secrets"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    name: Production gate
    runs-on: ubuntu-latest
    steps:
      - name: Require the confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "deploy-production" ]; then
            echo 'Refusing: type "deploy-production" in the confirm box to deploy.'
            exit 1
          fi

      - name: Require green CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&per_page=1" \
            --jq '.workflow_runs[0].conclusion // "none"')
          if [ "$conclusion" != "success" ]; then
            echo "Refusing to deploy: CI for ${{ github.sha }} is '$conclusion' (need success)."
            echo "Push the commit, let CI finish green, then re-run this workflow."
            exit 1
          fi
          echo "CI green on ${{ github.sha }} — deploying to production."

  migrate:
    name: Apply migrations
    needs: gate
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0 — keep in lockstep with deploy-staging.yml
        with:
          version: 2.109.1  # keep in lockstep with deploy-staging.yml

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      - name: Push migrations
        run: supabase db push

  # Runs AFTER sync-secrets, never alongside it — see the long note on the same
  # job in deploy-staging.yml. This is the workflow where it actually bites:
  # production has never run, so its first execution IS the runbook's
  # sync_secrets-ticked first deploy, against real customer data (review B3).
  deploy-functions:
    name: Deploy edge functions
    needs: [migrate, sync-secrets]
    if: ${{ !cancelled() && needs.migrate.result == 'success' && needs.sync-secrets.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0 — keep in lockstep with deploy-staging.yml
        with:
          version: 2.109.1

      - name: Deploy all functions
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # The vault key must be able to read THIS project's data, and the place
      # to discover otherwise is here, not at a client's front door (B2).
      # Verifies the property rather than the bytes: it calls the function that
      # just deployed, which decrypts the canary with the key actually loaded
      # in the running isolate. A digest comparison of the secret would only
      # prove two strings match — not that the key was applied, not that the
      # function can reach it, and not that it opens this project's rows.
      #
      # On a project that has never stored a credential this installs the pin,
      # which can only ever bless the key the deployment is already using.
      - name: Verify the vault key opens this project
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Hard failure, not a warning. On the first staging run of this step
          # the secret was unset, so it printed a warning and passed — a green
          # deploy that verified nothing, indistinguishable from a verified one
          # unless somebody reads the annotations. That is the same false
          # assurance as the typecheck that checked zero files. In production
          # an unverifiable vault key is not a nice-to-have: refuse.
          if [ -z "$SERVICE_KEY" ]; then
            echo "::error title=Cannot verify the vault key::SUPABASE_SERVICE_ROLE_KEY is not set for the production environment, so there is no way to confirm VAULT_MASTER_KEY opens this project's credentials. Add it under Settings -> Environments -> production (Supabase dashboard -> Settings -> API -> service_role). See docs/dev/vault-key-rotation.md."
            exit 1
          fi
          body=$(curl -sS --fail-with-body -X POST \
            "https://$PROJECT_REF.supabase.co/functions/v1/vault-rekey" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"action":"verify"}' 2>&1) || {
              echo "$body"
              echo "::error title=The deployed vault key cannot read this project::vault-rekey/verify failed. If this says key_mismatch, VAULT_MASTER_KEY is not the key these credentials were encrypted with — do NOT re-run with a new key, and do not rewrap. Put the previous key back, or supply it as VAULT_MASTER_KEY_PREVIOUS. See docs/dev/vault-key-rotation.md."
              exit 1
            }
          # No secret is printed: the response carries a key id and counts only.
          echo "$body"

  # ── The frontend, LAST ────────────────────────────────────────────────────
  # Vercel's Git integration used to deploy `main` to production on push, with
  # no knowledge of GitHub Actions (review H16). Two problems in one:
  #
  #   * ungated — the change that reaches every user in ninety seconds was the
  #     one nothing checked, while the database half needed a typed phrase and
  #     an environment approval;
  #   * out of ORDER — api.ts is a direct PostgREST/RPC client, so "stateless"
  #     does not mean "schema-independent". A frontend ahead of its migrations
  #     means a client opening the portal to a screen that errors because the
  #     RPC it calls does not exist yet.
  #
  # Database-first is the safe direction and this job encodes it. Migrations are
  # append-only and additive, so a new schema under an old frontend keeps
  # working; the reverse does not.
  #
  # Vercel's production branch is `release/production`, a ref only this job
  # advances. That is a git fact plus one dashboard field — no Vercel behaviour
  # to trust, unlike an "Ignored Build Step" or a deploy hook whose interaction
  # with auto-deploy has to be taken on faith.
  frontend:
    name: Release the frontend
    needs: [migrate, deploy-functions]
    # Gated on deploy-functions DIRECTLY, not on assert-deployed:
    # that job exits 0 when migrate failed (it defers the report to migrate's
    # own job), so keying off its result would ship a frontend on top of a
    # database that never migrated — the exact bug, rebuilt.
    if: ${{ needs.migrate.result == 'success' && needs.deploy-functions.result == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - name: Advance release/production to the deployed commit
        run: |
          # Deliberately NOT --force. A non-fast-forward push means the commit
          # being deployed is not a descendant of what is already live, i.e.
          # somebody is rolling back by re-dispatching an older commit. That
          # should not happen by accident: roll the frontend back with Vercel's
          # instant rollback (Deployments -> ... -> Promote), which is one click
          # and does not need a build.
          if git push origin "${{ github.sha }}:refs/heads/release/production"; then
            echo "release/production -> ${{ github.sha }}"
          else
            echo "::error title=Could not advance release/production::The push was rejected, which almost always means ${{ github.sha }} is not a descendant of the commit currently released. If you are intentionally rolling back, use Vercel's instant rollback instead of forcing this ref. See docs/dev/production-cutover.md."
            exit 1
          fi

      # Pushing a ref is fire-and-forget: without this the job would report
      # success having no idea whether Vercel built anything at all. This
      # repository has found that shape three times now (a typecheck that
      # checked zero files, a vault verification that verified nothing, a
      # deploy that could skip its own function job) — so assert the outcome,
      # not the mechanism. `version.json` is stamped with the commit at build
      # time by vite.config.ts.
      - name: Confirm production is serving this commit
        env:
          BASE: ${{ secrets.APP_BASE_URL }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::error title=Cannot confirm the frontend::APP_BASE_URL is not set for the production environment, so there is no way to check which build is live. Add it under Settings -> Environments -> production."
            exit 1
          fi
          deadline=$(( $(date +%s) + 600 ))
          served=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            served=$(curl -sS -H 'Cache-Control: no-cache' \
              "${BASE%/}/version.json?t=$(date +%s)" 2>/dev/null \
              | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "$served" = "$SHA" ]; then
              echo "production is serving $SHA"
              exit 0
            fi
            echo "serving '${served:-<nothing>}', waiting for $SHA"
            sleep 15
          done
          echo "::error title=Production is not serving the deployed commit::After 10 minutes ${BASE%/}/version.json still reports '${served:-<nothing>}' rather than $SHA. The database and edge functions ARE deployed; only the frontend is behind. Check that the Vercel production project's Git branch is release/production (Settings -> Git) and that its last deployment succeeded."
          exit 1

  # Guards the jobs above against their own `if` — see the note on the same job
  # in deploy-staging.yml. A green production deploy that deployed nothing is a
  # worse outcome than a red one.
  assert-deployed:
    name: Everything actually deployed
    needs: [migrate, deploy-functions, frontend]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Each stage must have run, not merely not-failed
        env:
          MIGRATE: ${{ needs.migrate.result }}
          FUNCTIONS: ${{ needs.deploy-functions.result }}
          FRONTEND: ${{ needs.frontend.result }}
        run: |
          echo "migrate=$MIGRATE deploy-functions=$FUNCTIONS frontend=$FRONTEND"
          if [ "$MIGRATE" != "success" ]; then
            echo "migrations did not succeed — that failure is reported by its own job"
            exit 0
          fi
          if [ "$FUNCTIONS" != "success" ]; then
            echo "::error title=No functions were deployed::migrate succeeded but deploy-functions ended '$FUNCTIONS'. A skipped job does not fail a workflow, so without this check the run would have reported success having deployed nothing."
            exit 1
          fi
          if [ "$FRONTEND" != "success" ]; then
            echo "::error title=The frontend was not released::migrate and deploy-functions succeeded but frontend ended '$FRONTEND'. Production is now running new database schema behind an OLD frontend. That direction is safe (migrations are additive) but it is not what was asked for — re-run this workflow."
            exit 1
          fi
          echo "ok"

  sync-secrets:
    name: Sync edge secrets (opt-in)
    if: ${{ inputs.sync_secrets }}
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0 — keep in lockstep with deploy-staging.yml
        with:
          version: 2.109.1

      - name: Push edge-function secrets
        run: |
          args=()
          add() { if [ -n "$2" ]; then args+=("$1=$2"); else echo "skip: $1 not set"; fi; }
          add STRIPE_SECRET_KEY     "${{ secrets.STRIPE_SECRET_KEY }}"
          add STRIPE_WEBHOOK_SECRET "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          add VAULT_MASTER_KEY      "${{ secrets.VAULT_MASTER_KEY }}"
          add APP_BASE_URL          "${{ secrets.APP_BASE_URL }}"
          add RESEND_API_KEY        "${{ secrets.RESEND_API_KEY }}"
          add NOTIFY_FROM_EMAIL     "${{ secrets.NOTIFY_FROM_EMAIL }}"
          if [ ${#args[@]} -eq 0 ]; then echo "nothing to sync"; exit 0; fi
          supabase secrets set "${args[@]}" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
