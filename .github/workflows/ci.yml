name: CI

on:
  # `push` is scoped to main. Previously it was unscoped, so every commit on a
  # branch with an open PR ran the ENTIRE suite twice on identical code —
  # double the runner minutes for zero extra coverage, and double the exposure
  # to a wedged runner. main still needs its push run: deploy-staging.yml gates
  # on `workflow_run` for branches: [main] and would otherwise never fire.
  push:
    branches: [main]
  pull_request:

# A superseded run cannot outlive the commit it was testing. Without this, a
# job stuck on a network step leaves a permanently in-progress check that
# nothing in this repository can clear — the token 403s on Actions writes, and
# GitHub's own job timeout is six hours. Deliberately NOT applied to the deploy
# workflows: cancelling a `db push` halfway is how an environment ends up in a
# state nobody can describe.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — tsc, vitest, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci --prefix app

      # Run inside app/ so npx resolves app/node_modules/.bin/tsc — from the
      # repo root it would fetch the abandoned `tsc` npm package instead.
      #
      # `-b --force`, not `--noEmit -p .`: app/tsconfig.json is a solution
      # file ("files": [] plus references to tsconfig.app/node.json), so
      # `-p .` type-checks zero files and exits 0 on a syntax error — this
      # step passed unconditionally until now. Only build mode follows the
      # references. --force because -b is incremental and a cached
      # tsbuildinfo would otherwise let it skip work. Both referenced
      # projects set noEmit, so nothing is written.
      - name: Typecheck
        working-directory: app
        run: npx tsc -b --force

      - name: Lint (warnings fail)
        working-directory: app
        run: npm run lint

      - name: Unit tests
        working-directory: app
        run: npm run test -- --run

      - name: Build
        working-directory: app
        run: npm run build

      - name: Secret-leak grep (validate gate 7)
        run: |
          if grep -RInE "(VAULT_MASTER_KEY|SERVICE_ROLE|sk_live|sk_test)" \
               app/src supabase/functions --include='*.ts' --include='*.tsx' \
               | grep -v 'Deno.env.get' | grep -v env.ts | grep -q .; then
            echo "FAIL: literal secret reference found"; exit 1
          fi
          echo "PASS: no secret literals"

      # Both deploy workflows confirm a release by polling
      # APP_BASE_URL/version.json for the commit they just shipped (review
      # H16). If the build stops emitting it, that check has nothing to read
      # and every deploy fails at the last step — after the database has
      # already migrated. Catch it here instead, where it costs a PR.
      - name: The build stamps the commit it was built from
        run: |
          f=app/dist/version.json
          if [ ! -f "$f" ]; then
            echo "FAIL: $f was not emitted — stampVersion() in app/vite.config.ts is not running, and the deploy workflows' release confirmation has nothing to poll."
            exit 1
          fi
          cat "$f"
          commit=$(jq -r '.commit // empty' "$f")
          if [ -z "$commit" ]; then
            echo "FAIL: version.json carries no commit"; exit 1
          fi
          # CI sets GITHUB_SHA, so the fallback must not be what lands here —
          # that would make the deploy poll compare the SHA against "dev"
          # forever, and time out on a deploy that had actually worked.
          if [ "$commit" != "$GITHUB_SHA" ]; then
            echo "FAIL: version.json says '$commit' but this build is $GITHUB_SHA. The builder's commit env var is not being read."
            exit 1
          fi
          echo "PASS: version.json stamped with $commit"

      # The SPA rewrite sends everything it does not exclude to index.html, so
      # an un-excluded version.json would answer the deploy poll with HTML
      # forever. Asserted against the config rather than trusted, because the
      # only place to find out otherwise is a production deploy.
      - name: version.json is excluded from the SPA rewrite
        run: |
          if ! jq -e '.rewrites[0].source | contains("version")' app/vercel.json >/dev/null; then
            echo "FAIL: app/vercel.json rewrites /version.json to index.html, so the deploy release check can never pass."
            exit 1
          fi
          echo "PASS: version.json is served as a file"

      # The DEV-gated preview routes carry hardcoded demo people and pets.
      # They are stripped by `import.meta.env.DEV` being statically false in a
      # production build — but that is a property of the bundler, not of the
      # source, so it is asserted against the artefact rather than assumed.
      - name: DEV fixtures absent from the production bundle
        run: |
          if grep -rlE "Juniper|Lakeside Loop|Oak Trail|Maple Walk|Mira Chen|Riverside Path|Bramble|Nutmeg" app/dist/assets/*.js; then
            echo "FAIL: DEV preview fixtures reached the production bundle"; exit 1
          fi
          echo "PASS: no DEV fixtures in dist"

      # A var() naming a property nothing defines makes the whole declaration
      # invalid, and CSS fails silently: the element keeps its inherited value
      # and the page still renders, just wrong. Two shipped this way — a
      # font-size on --fs-13 (the scale is 12/14/16/20/24/32/44) and four
      # colour tokens written from memory. Both were caught by hand; this is
      # the check that catches the next one.
      - name: Every CSS token used is a token that exists
        run: |
          python3 - <<'PY'
          import re, pathlib, glob, sys
          defined, used = set(), {}
          for f in glob.glob('app/src/styles/**/*.css', recursive=True):
              # Comments first. A `var(--role)` written in prose to explain a
              # rule is not a use, and neither is a `--x:` inside one; without
              # this the check fails on its own documentation.
              t = re.sub(r'/\*.*?\*/', '', pathlib.Path(f).read_text(), flags=re.S)
              defined |= set(re.findall(r'(--[a-zA-Z0-9-]+)\s*:', t))
              for m in re.finditer(r'var\(\s*(--[a-zA-Z0-9-]+)', t):
                  used.setdefault(m.group(1), f)
          missing = sorted((k, v) for k, v in used.items() if k not in defined)
          if missing:
              for k, v in missing:
                  print(f"::error file={v}::{k} is used but never defined")
              sys.exit(1)
          print(f"{len(used)} custom properties used, all defined")
          PY

      # Twenty error messages were rendered as bare spans with no role and no
      # live region, so every failure in the product — including "ending the
      # walk did not bill" — was silent to a screen reader. FormError in
      # fields.tsx is now the only place that renders one; this keeps it that
      # way, because the bare pattern is the more obvious thing to write.
      - name: Errors go through FormError, not a bare span
        run: |
          if grep -rn 'className="field__error"' app/src --include='*.tsx' \
               | grep -v 'src/components/fields.tsx' | grep -q .; then
            echo "FAIL: bare field__error outside fields.tsx — use <FormError message={…} />:"
            grep -rn 'className="field__error"' app/src --include='*.tsx' \
              | grep -v 'src/components/fields.tsx'
            exit 1
          fi
          echo "PASS: all form errors render through FormError"

      # The shells supply the one <main> per route (AppMain). Two components
      # carried their own from before that existed, and TodayIllustratedSchedule's
      # ended up NESTED inside the shell's — invalid, and two "main" landmarks on
      # the operator's flagship screen. Landmarks are exactly the thing nobody
      # notices is wrong, so the rule is checked rather than remembered.
      - name: Exactly one <main>, owned by AppMain
        run: |
          # `|| true`: steps run under `bash -e`, and a pipeline whose last
          # grep matches nothing exits 1 — which is the PASS case here.
          offenders=$(grep -rn '<main[ >]' app/src --include='*.tsx' \
                        | grep -v 'src/components/AppMain.tsx' \
                        | grep -v '\.test\.tsx' || true)
          if [ -n "$offenders" ]; then
            echo "FAIL: a main element outside AppMain — the shell owns the landmark:"
            echo "$offenders"
            exit 1
          fi
          echo "PASS: one main landmark, supplied by the shell"

      # The live-GPS topic carries the real-time position of a named person at
      # a named residential address. `private` defaults to FALSE in
      # realtime-js, so omitting the option is not a smaller mistake than
      # writing `private: false` — it is the same one, and it is invisible in
      # review. There is exactly one channel in this application; keep it that
      # way, and keep it private (review H1).
      - name: The walk channel is private, and is the only channel
        run: |
          callers=$(grep -rln 'supabase\.channel(' app/src --include='*.ts' --include='*.tsx' || true)
          if [ "$callers" != "app/src/hooks/useWalkChannel.ts" ]; then
            echo "FAIL: supabase.channel() is called outside useWalkChannel.ts:"
            echo "$callers"
            echo "Every channel needs its own realtime.messages policy; add one to migration"
            echo "history and extend this check, rather than opening an unauthorized topic."
            exit 1
          fi
          # Matched on the call itself, not on the string anywhere in the file:
          # the first version of this check passed against a channel with the
          # option deleted, because the comment above it still said
          # "private: true". A grep that a comment can satisfy is not a check.
          if ! grep -Eq 'supabase\.channel\([^)]*config: *\{ *private: true' app/src/hooks/useWalkChannel.ts; then
            echo "FAIL: the walk channel is not private — the topic is joinable by any"
            echo "holder of the anon key, which ships in the bundle (review H1)."
            exit 1
          fi
          if grep -rn 'private: false' supabase/functions/_lib/broadcast.ts; then
            echo "FAIL: the server publishes to the public topic"; exit 1
          fi
          echo "PASS: one channel, private on both sides"

  # Backend-free: /dev/today renders deterministic fixtures with no Supabase,
  # so this runs in ~2 minutes against a plain `vite dev` and needs no secrets.
  # It exists because the suite it belongs to previously ran in NO workflow,
  # which is how a broken client-booking RPC reached production unnoticed.
  e2e-today:
    name: E2E — Today composition
    runs-on: ubuntu-latest
    # Fail fast rather than hang. This job has wedged on the browser install
    # five times in two evenings; at GitHub's default six-hour timeout each
    # stall blocked a merge, and two of them blocked the staging deploy,
    # because the deploy gate waits on this workflow completing. This ceiling
    # is the backstop, not the fix — the per-attempt timeouts below are what
    # let a stalled run recover instead of merely failing on schedule.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci --prefix app

      # Cache the browser so the common case makes no network call at all.
      # Keyed on the resolved Playwright version so a dependency bump fetches a
      # fresh browser instead of reusing a mismatched one — the version skew
      # that already needs a local escape hatch in playwright.config.mjs.
      - name: Resolve the Playwright version
        id: pw
        working-directory: app
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0 (node24; SHA resolved via git ls-remote this session)
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # `--with-deps` is deliberately gone, and this is the whole fix.
      #
      # The old single step ran apt-get and the browser download in one
      # command, so five stalls against a 33 s median produced no evidence
      # about which half hung. Splitting it named the culprit on the first
      # outing: three consecutive stalls in the apt half while the download
      # never got a turn.
      #
      # apt also cannot be bounded from inside the step, which is why it is
      # removed rather than retried. `playwright install-deps` shells out to
      # `sudo`, so apt-get runs as root; `timeout` runs as `runner` and is not
      # permitted to signal a root process, so the orphan survives its own
      # timeout and holds the step's stdout pipe open — the step keeps running
      # after the command it was waiting on is gone. A same-user child does die
      # with the group (verified); a root child does not. No amount of
      # per-attempt timeout fixes that.
      #
      # Dropping it is safe because the ubuntu-latest image already ships the
      # libraries Chromium links against — it ships Chrome and Edge. If that
      # ever stops being true the failure is loud and immediate: Playwright
      # refuses to launch and prints the exact missing packages. Restore a
      # bounded `install-deps` then, with the sudo problem solved.
      #
      # The download keeps a timeout and a retry: it is a plain network call
      # owned by `runner`, so `timeout` genuinely does bound it, and a stall is
      # precisely the failure a retry fixes. 90 s is ~3x the median.
      - name: Chromium browser
        working-directory: app
        run: |
          for attempt in 1 2 3; do
            if timeout -k 10s 90s npx playwright install chromium; then exit 0; fi
            echo "::warning::browser download attempt $attempt stalled or failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error::Chromium download failed three times"
          exit 1

      - name: Today composition (4 viewports)
        working-directory: app
        run: npx playwright test --config playwright.config.mjs e2e/indigo-emaki-today.spec.ts

      # Contrast measured from the rendered pixels rather than from tokens
      # (review H23). This is the gate whose absence let the same path be
      # "fixed" twice against the wrong background — both times with a
      # confident comment stating a ratio nobody had measured. The log prints
      # the full table on success too, so the numbers in components.css can be
      # checked against a run instead of trusted.
      - name: Today contrast (sampled from the artwork)
        working-directory: app
        run: npx playwright test --config playwright.config.mjs e2e/today-contrast.spec.ts

      # The rendered half of review H24. role-contrast.test.ts proves the token
      # arithmetic; this proves the browser agrees — it found a label reading a
      # legacy `--ink-500` alias that resolved past the role layer, so the
      # escalation inherited around it and the prefers-contrast override never
      # reached it either. No model check could have seen that.
      - name: Tint contrast (rendered component gallery)
        working-directory: app
        run: npx playwright test --config playwright.config.mjs e2e/tint-contrast.spec.ts

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 (node24)
        if: failure()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 7

  edge-functions:
    name: Edge functions — deno check + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5 (node24; SHA verified this session, so no longer floating)
        with:
          deno-version: v2.9.1  # verified release (matches the local toolchain)

      - name: Typecheck entrypoints
        run: deno check supabase/functions/*/index.ts

      - name: Tests
        # ./ prefix required: deno skips _-prefixed paths without it.
        #
        # --allow-read is scoped to the migrations directory and nothing else.
        # payment_status_test.ts parses the live definition of two partial
        # unique indexes out of the SQL, because asserting a literal status
        # list would only restate the code it is checking. Nothing else in the
        # suite touches the filesystem, and a test that starts needing more
        # than this should have to say so here.
        #
        # This string must stay identical to the one in CLAUDE.md. It was
        # `deno test` bare while the documented local command was `deno test
        # -A`, so a test could pass locally on a permission CI does not grant
        # — which is exactly how the above shipped red.
        run: deno test --allow-read=supabase/migrations ./supabase/functions/_tests/

      # Every deliberate 5xx used to discard the underlying Postgres/Stripe
      # error at the throw site, because HttpError had nowhere to put one
      # (review H14). Now it does — and this is what stops the next throw site
      # added from quietly going back to dropping it, which would be invisible
      # until an operator asked why a walk failed and there was no answer.
      #
      # A 5xx with three arguments is the defect. 4xx is exempt: those are the
      # caller being told something true about their own request, and there is
      # no underlying system error to attach.
      - name: Every 5xx throw carries its cause
        run: |
          python3 - <<'PY'
          import glob, re, sys
          # The whole call, across line breaks, so a wrapped throw is judged on
          # its arguments rather than on where the author put a newline.
          call = re.compile(r'new HttpError\(\s*(5\d\d)\s*,(.*?)\)\s*;', re.S)
          bad = []
          for f in glob.glob('supabase/functions/**/*.ts', recursive=True):
              if '/_tests/' in f:
                  continue
              src = open(f).read()
              for m in call.finditer(src):
                  args = m.group(2)
                  # code, message, cause -> at least two commas after the status.
                  depth, commas = 0, 0
                  for ch in args:
                      if ch in '([{': depth += 1
                      elif ch in ')]}': depth -= 1
                      elif ch == ',' and depth == 0: commas += 1
                  if commas < 2:
                      line = src[:m.start()].count('\n') + 1
                      bad.append(f"{f}:{line}")
          if bad:
              for b in bad:
                  print(f"::error file={b.split(':')[0]},line={b.split(':')[1]}::"
                        "this 5xx throws away the underlying error. Pass it as the "
                        "4th argument to HttpError (review H14).")
              sys.exit(1)
          print("PASS: every 5xx throw passes a cause")
          PY

      - name: No secret logging grep (phase 01 gate)
        run: |
          if grep -RInE "console\.(log|error|warn|info)\(.*\b(secret|password|ciphertext|plaintext|decrypted)" \
               supabase/functions/ | grep -q .; then
            echo "FAIL: potential secret logging"; exit 1
          fi
          echo "PASS: no secret logging"

  database:
    name: Database — migrations, smoke, materializer
    runs-on: ubuntu-latest
    services:
      postgres:
        # Match supabase/config.toml [db].major_version and production.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LOCAL_DB_URL: postgresql://postgres:postgres@localhost:54322/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)

      - name: Reset — shim + migrations 0001..NNNN + seed
        run: ./scripts/db-reset.sh

      # psql RAISE NOTICE output (including the PASS markers) goes to
      # stderr — merge streams before the tee/grep.
      - name: Smoke suite (credit engine + full spec-03 security matrix)
        run: |
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/smoke.sql 2>&1 \
            | tee /tmp/smoke.out
          grep -q "SMOKE PASS" /tmp/smoke.out

      - name: Materializer suite (idempotency, skips, no resurrection)
        run: |
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/materializer.sql 2>&1 \
            | tee /tmp/mat.out
          grep -q "MATERIALIZER PASS" /tmp/mat.out

      # Asserted against the catalogue, not the migration text. The grep this
      # replaces matched `update +clients +set +credit_balance`, so a newline,
      # a tab, or a second space between any two words walked straight past it
      # — and it read the files rather than what Postgres actually installed.
      # pg_proc holds the real bodies of the real functions after all 18
      # migrations have run, including any later CREATE OR REPLACE.
      - name: Invariant 1 — credit_balance written only by fn_ledger_apply
        run: |
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare offenders text;
          begin
            select string_agg(p.proname, ', ' order by p.proname) into offenders
            from pg_proc p
            join pg_namespace n on n.oid = p.pronamespace
            where n.nspname = 'public'
              and p.proname <> 'fn_ledger_apply'
              and p.prosrc ~* 'update[[:space:]]+clients[[:space:]]+set[^;]*credit_balance';
            if offenders is not null then
              raise exception 'INVARIANT 1 FAIL: credit_balance written outside fn_ledger_apply by: %', offenders;
            end if;
            raise notice 'INVARIANT 1 PASS: credit_balance writes confined to fn_ledger_apply';
          end $$;
          SQL

      # The nightly job generates every walk on every calendar and runs the
      # credit-expiry sweep. It used to be scheduled by a hand-typed dashboard
      # entry that no restore recreated and nothing asserted (review H15), and
      # the horizon is 14 days — so its absence was invisible for a fortnight.
      # Asserted against cron.job, not against the migration text: what matters
      # is what a fresh database ends up with after every migration has run.
      - name: The nightly schedule is in a migration
        run: |
          psql "$LOCAL_DB_URL" -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare v record;
          begin
            select schedule, command into v from cron.job where jobname = 'sanpo-nightly';
            if not found then
              raise exception
                'H15 FAIL: no sanpo-nightly cron job after all migrations. The '
                'schedule has gone back to being an unversioned dashboard step.';
            end if;
            if v.command not like '%fn_run_nightly_jobs%' then
              raise exception 'H15 FAIL: sanpo-nightly runs "%", not the nightly entry point', v.command;
            end if;
            raise notice 'H15 PASS: nightly job scheduled by migration (% / %)', v.schedule, v.command;
          end $$;
          SQL

      # types.ts is generated from the live schema by scripts/gen-types.py. It
      # is committed, so it silently rots whenever a migration lands without a
      # regeneration — and a stale Database type makes tsc agree with code that
      # the database will reject at runtime.
      - name: Generated types match the schema
        run: |
          python3 scripts/gen-types.py
          if ! git diff --exit-code -- app/src/lib/types.ts; then
            echo "FAIL: app/src/lib/types.ts is stale — run python3 scripts/gen-types.py and commit"
            exit 1
          fi
          echo "PASS: types.ts matches the migrated schema"

  # CLAUDE.md invariant 6 says migrations are append-only once applied. That
  # rule has been enforced only by a local PreToolUse hook and by whoever is
  # paying attention — nothing a reviewer or CI could see. An edit to an
  # already-applied migration diverges every environment that ran the old one.
  migrations-append-only:
    name: Migrations — append-only
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0

      - name: No edits to migrations that already exist on the base branch
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          # Three-dot: compare against the merge base, so unrelated commits
          # landing on the base branch meanwhile are not blamed on this PR.
          touched=$(git diff --name-status "$base...HEAD" -- supabase/migrations/ \
                    | awk '$1 != "A" { print }')
          if [ -n "$touched" ]; then
            echo "FAIL: existing migrations modified or deleted (invariant 6):"
            echo "$touched"
            echo
            echo "Migrations are append-only. Add a new numbered migration instead."
            exit 1
          fi
          echo "PASS: migrations are append-only"
