name: Deploy staging (Supabase)

# Applies migrations and deploys all edge functions to the staging Supabase
# project. Run it from the Actions tab (workflow_dispatch) or by pushing to
# main. One-time project setup lives in docs/dev/staging-setup.md.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN   personal access token (supabase.com/dashboard/account/tokens)
#   SUPABASE_PROJECT_REF    the project's ref (Settings → General)
#   SUPABASE_DB_PASSWORD    the project's database password
# For the optional "sync edge secrets" step:
#   STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, VAULT_MASTER_KEY, APP_BASE_URL
#   and optionally RESEND_API_KEY, NOTIFY_FROM_EMAIL

# Deploy only after CI passes on main (workflow_run gate) — a red commit
# must never migrate the live database. Manual runs (workflow_dispatch) are
# still allowed for secret syncs / re-deploys.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sync_secrets:
        description: "Also push edge-function secrets from GitHub secrets"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  # A real job (not a job-level `if`) that FAILS when the trigger isn't a
  # successful push-CI run from this repo. A skipped `if` would let the run
  # still conclude 'success' and fire the chained smoke test after a red CI;
  # a failing gate turns the whole run red so nothing downstream runs.
  gate:
    name: Deploy gate
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI passed on a push to this repo
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — allowed"; exit 0
          fi
          conclusion="${{ github.event.workflow_run.conclusion }}"
          evt="${{ github.event.workflow_run.event }}"
          repo="${{ github.event.workflow_run.head_repository.full_name }}"
          if [ "$conclusion" = "success" ] && [ "$evt" = "push" ] \
             && [ "$repo" = "${{ github.repository }}" ]; then
            echo "CI green on a push to ${{ github.repository }} — deploying"; exit 0
          fi
          # Still a refusal, and still red — a skipped gate would let the run
          # conclude 'success' and fire the chained smoke against a commit
          # that never deployed. But a refusal on a CANCELLED run means
          # something quite different from one on a FAILED run, and the two
          # are indistinguishable at a glance in the Actions list.
          #
          # Cancelled is routine: CI carries cancel-in-progress, so two pushes
          # close together cancel the first run, and a run wedged on a network
          # step is cancelled by GitHub's six-hour ceiling hours later. Both
          # fire workflow_run on completion. One did exactly that at 07:21 on
          # 2026-08-18, six hours after the b4697d1 run stalled — a red deploy
          # for a commit whose work had already shipped.
          #
          # So say which it is. A red that explains itself in its own first
          # line costs a reader seconds; one that does not costs them the
          # whole investigation, and teaches them to skim past the next.
          if [ "$conclusion" = "cancelled" ]; then
            printf '::warning title=Nothing to deploy::CI for this commit was cancelled, not failed — superseded by a newer push, or killed by GitHub six-hour job ceiling. No deploy is expected. If a newer commit is on main its own run deploys it; if not, re-run CI for this commit.\n'
            echo "Refusing to deploy a cancelled CI run (conclusion=$conclusion event=$evt)"
            exit 1
          fi
          echo "Refusing to deploy: conclusion=$conclusion event=$evt repo=$repo"
          exit 1

  migrate:
    name: Apply migrations
    needs: gate
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0 — composite since v2, so it no longer carries a Node runtime at all
        with:
          version: 2.109.1  # pinned to current latest; 2.99.0 predates the local_smtp config key and broke `supabase link`

      # A dead SUPABASE_ACCESS_TOKEN surfaces here as a bare
      # {"message":"Unauthorized"} — which reads like a code or migration
      # problem and is neither. These tokens expire (a 15-day one lapsed on
      # 2026-08-12 and silently broke staging deploys for two weeks), so name
      # the likely cause in the failure itself. The original CLI output is
      # always printed first, and the hint only fires on an auth rejection so
      # an unrelated failure is never mislabelled.
      - name: Link project
        run: |
          if out=$(supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" 2>&1); then
            printf '%s\n' "$out"
            exit 0
          fi
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -qi 'unauthorized'; then
            printf '::error title=Supabase rejected the credentials::supabase link returned Unauthorized. Most likely SUPABASE_ACCESS_TOKEN has expired or been revoked — mint a new one at supabase.com/dashboard/account/tokens and update it under Settings -> Environments -> staging. If the token is fresh, check SUPABASE_PROJECT_REF still matches the project and that the token owner is a member of its organisation. See docs/dev/staging-setup.md (Troubleshooting).\n'
          fi
          exit 1

      - name: Push migrations
        run: supabase db push

  # Runs AFTER sync-secrets, never alongside it. Both jobs used to declare
  # `needs: migrate`, so on the one run that matters most — the first deploy of
  # a project, which the runbook tells you to do with sync_secrets ticked —
  # they started together and raced. A function that wins that race is live
  # without VAULT_MASTER_KEY, and the vault is the part of this system where
  # "live but misconfigured" is worst: it fails on a real door code, in the
  # dark, at a client's front door (review B3).
  #
  # The explicit `if` is required, not decoration. Adding `sync-secrets` to
  # `needs` would otherwise skip this job on every ordinary push, because
  # sync-secrets is opt-in and a skipped dependency skips its dependents by
  # default. Overriding `if` drops that default entirely, which is why
  # migrate's success is re-asserted here by hand: 'skipped' and 'success' both
  # proceed, only 'failure' stops us.
  deploy-functions:
    name: Deploy edge functions
    needs: [migrate, sync-secrets]
    if: ${{ !cancelled() && needs.migrate.result == 'success' && needs.sync-secrets.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0 — composite since v2, so it no longer carries a Node runtime at all
        with:
          version: 2.109.1  # pinned to current latest; 2.99.0 predates the local_smtp config key and broke `supabase link`

      # Deploys every function directory; config.toml carries
      # verify_jwt=false for stripe-webhook and the materializer cron note.
      - name: Deploy all functions
        run: supabase functions deploy --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # The vault key must be able to read THIS project's data, and the place
      # to discover otherwise is here, not at a client's front door (B2).
      # Verifies the property rather than the bytes: it calls the function that
      # just deployed, which decrypts the canary with the key actually loaded
      # in the running isolate. A digest comparison of the secret would only
      # prove two strings match — not that the key was applied, not that the
      # function can reach it, and not that it opens this project's rows.
      #
      # On a project that has never stored a credential this installs the pin,
      # which can only ever bless the key the deployment is already using.
      - name: Verify the vault key opens this project
        env:
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # A warning here and a hard failure in deploy-production.yml, on
          # purpose. This step's first real run (5193e69) found the secret
          # unset and passed, verifying nothing — so on staging it is currently
          # decoration, and issue #31 tracks setting the secret. Staging stays
          # non-fatal because blocking every deploy on a secret only the owner
          # can add would be worse than the gap; production does not get that
          # latitude, because there the gap reaches a real door code.
          if [ -z "$SERVICE_KEY" ]; then
            echo "::warning title=Vault key NOT verified::SUPABASE_SERVICE_ROLE_KEY is not set for the staging environment, so the deployed vault key was not checked against the canary and this deploy proves nothing about it. Add it under Settings -> Environments -> staging (Supabase dashboard -> Settings -> API -> service_role). See docs/dev/vault-key-rotation.md and issue #31."
            exit 0
          fi
          body=$(curl -sS --fail-with-body -X POST \
            "https://$PROJECT_REF.supabase.co/functions/v1/vault-rekey" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"action":"verify"}' 2>&1) || {
              echo "$body"
              echo "::error title=The deployed vault key cannot read this project::vault-rekey/verify failed. If this says key_mismatch, VAULT_MASTER_KEY is not the key these credentials were encrypted with — do NOT re-run with a new key, and do not rewrap. Put the previous key back, or supply it as VAULT_MASTER_KEY_PREVIOUS. See docs/dev/vault-key-rotation.md."
              exit 1
            }
          # No secret is printed: the response carries a key id and counts only.
          echo "$body"

  # Guards the job above against its own `if`. A skipped job does not fail its
  # workflow, so an expression mistake there would produce a run that reports
  # success while deploying no functions at all — the same green-but-empty
  # failure this file is elsewhere trying to remove. Assert the outcome instead
  # of trusting the expression that produces it.
  assert-functions-deployed:
    name: Functions actually deployed
    needs: [migrate, deploy-functions]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: deploy-functions must have run, not merely not-failed
        env:
          MIGRATE: ${{ needs.migrate.result }}
          FUNCTIONS: ${{ needs.deploy-functions.result }}
        run: |
          echo "migrate=$MIGRATE deploy-functions=$FUNCTIONS"
          if [ "$MIGRATE" != "success" ]; then
            echo "migrations did not succeed — that failure is reported by its own job"
            exit 0
          fi
          if [ "$FUNCTIONS" != "success" ]; then
            echo "::error title=No functions were deployed::migrate succeeded but deploy-functions ended '$FUNCTIONS'. A skipped job does not fail a workflow, so without this check the run would have reported success having deployed nothing."
            exit 1
          fi
          echo "ok"

  sync-secrets:
    name: Sync edge secrets (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.sync_secrets }}
    needs: migrate
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0 — composite since v2, so it no longer carries a Node runtime at all
        with:
          version: 2.109.1  # pinned to current latest; 2.99.0 predates the local_smtp config key and broke `supabase link`

      - name: Push edge-function secrets
        run: |
          args=()
          add() { if [ -n "$2" ]; then args+=("$1=$2"); else echo "skip: $1 not set"; fi; }
          add STRIPE_SECRET_KEY   "${{ secrets.STRIPE_SECRET_KEY }}"
          add STRIPE_WEBHOOK_SECRET "${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          add VAULT_MASTER_KEY    "${{ secrets.VAULT_MASTER_KEY }}"
          add APP_BASE_URL        "${{ secrets.APP_BASE_URL }}"
          add RESEND_API_KEY      "${{ secrets.RESEND_API_KEY }}"
          add NOTIFY_FROM_EMAIL   "${{ secrets.NOTIFY_FROM_EMAIL }}"
          if [ ${#args[@]} -eq 0 ]; then echo "nothing to sync"; exit 0; fi
          supabase secrets set "${args[@]}" --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
