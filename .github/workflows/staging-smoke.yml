name: Staging smoke test

# Post-deploy check that the edge functions accept scheduled (service-role)
# invocations — calls materialize-walks exactly the way the dashboard cron
# job does. Runs automatically after each successful staging deploy, or on
# demand from the Actions tab. The service key is fetched at runtime via the
# management API (existing SUPABASE_ACCESS_TOKEN secret), masked, and never
# printed to the log.

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy staging (Supabase)"]
    types: [completed]

# Was `{}`, which is right for a workflow that only makes outbound HTTP calls
# and wrong the moment one of its jobs checks the repository out — on a private
# repository `actions/checkout` needs this scope and 403s without it. The
# `auth-posture` job gained a checkout in #48 and has not run since (every
# staging-smoke run after it was `skipped`, because it fires on a successful
# staging deploy and staging has not deployed), so the gap has never shown
# itself. Found while giving the new verify-deployment workflow the same
# treatment; read-only either way.
permissions:
  contents: read

# Serialize runs: they share fixed fixture emails, so concurrent runs would
# fight over the same throwaway users.
concurrency:
  group: staging-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Invoke materialize-walks as the cron would
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Fetch service key (masked)
        run: |
          key=$(curl -sSf \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_REF }}/api-keys?reveal=true" \
            | jq -r '[.[] | select(.name == "service_role")][0].api_key')
          if [ -z "$key" ] || [ "$key" = "null" ]; then
            echo "FAIL: could not fetch the service_role key from the management API"
            exit 1
          fi
          echo "::add-mask::$key"
          echo "SERVICE_KEY=$key" >> "$GITHUB_ENV"

      - name: POST materialize-walks
        run: |
          body=$(mktemp)
          status=$(curl -sS -o "$body" -w '%{http_code}' -X POST \
            "https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co/functions/v1/materialize-walks" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" -d '{}' --max-time 30)
          echo "HTTP $status"
          cat "$body"; echo
          [ "$status" = "200" ] && grep -q '"ok":true' "$body"


  onboard-repro:
    name: Replay operator onboard flow
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      # For scripts/staging-fixtures.sh, which both replays source: the
      # throwaway-fixture helpers each step used to define inline, where the
      # onboard replay kept the defects the claim replay had been cured of.
      #
      # `ref` pins the commit the deploy just shipped. On a workflow_run event
      # `github.sha` is main's newest commit when this run starts, so without
      # it a merge landing in between would replay newer helpers against the
      # older deployment (Codex, on #97). The same expression as every
      # checkout in deploy-staging.yml; `scripts/verify-workflows.py` rule 4.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Fetch API keys (masked)
        run: |
          keys=$(curl -sSf \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ACCESS_TOKEN }}" \
            "https://api.supabase.com/v1/projects/${{ secrets.SUPABASE_PROJECT_REF }}/api-keys?reveal=true")
          service=$(echo "$keys" | jq -r '[.[] | select(.name == "service_role")][0].api_key')
          anon=$(echo "$keys" | jq -r '[.[] | select(.name == "anon")][0].api_key')
          if [ -z "$service" ] || [ "$service" = "null" ] || [ -z "$anon" ] || [ "$anon" = "null" ]; then
            echo "FAIL: could not fetch API keys"; exit 1
          fi
          echo "::add-mask::$service"
          echo "::add-mask::$anon"
          { echo "SERVICE_KEY=$service"; echo "ANON_KEY=$anon"; } >> "$GITHUB_ENV"

      - name: Replay onboard (signup → insert operators → role select)
        run: |
          base="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co"
          # Unique per run. A throwaway fixture has no reason to hold a
          # stable address, and a stable one makes cleanup a PRECONDITION: if
          # the previous run failed to delete its user, this run cannot even
          # start. That is what happened — every `on delete restrict` in the
          # schema means the operators row survives while any dependent row
          # does, so the auth user could not be deleted and the next run
          # collided on 422 forever.
          #
          # A run-scoped address makes the collision structurally impossible
          # and demotes cleanup from a precondition to housekeeping.
          email="diag-onboard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@sanpo.test"; pass="Diag-$(date +%s)-pw"
          # admin, user_id_for, del, delete_operator, create_user — shared with
          # the claim replay below. This step used to carry its own copies: a
          # one-page lookup, deletes behind `|| true`, and a create piped into
          # jq, the three defects the claim replay was cured of.
          . scripts/staging-fixtures.sh

          # No sweep for a previous run's leftover: the address is this run's
          # alone, so the sweep paged through every auth user in staging to
          # find nothing. A collision would still be caught: create_user
          # reports a 422 and says which half of cleanup failed.
          uid=$(create_user "$email" "$pass") || exit 1
          trap 'delete_operator "$uid"' EXIT
          echo "fixture user: $uid"

          tok=$(curl -sS -X POST "$base/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$email\",\"password\":\"$pass\"}" | jq -r '.access_token')
          if [ -z "$tok" ] || [ "$tok" = "null" ]; then echo "FAIL: password sign-in"; exit 1; fi
          echo "::add-mask::$tok"
          echo "sign-in: OK"

          ins=$(mktemp)
          icode=$(curl -sS -o "$ins" -w '%{http_code}' -X POST "$base/rest/v1/operators" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $tok" \
            -H "Content-Type: application/json" -H "Prefer: return=representation" \
            -d "{\"id\":\"$uid\",\"business_name\":\"Diag Walks\",\"display_name\":\"Diag\",\"email\":\"$email\"}")
          echo "INSERT operators -> HTTP $icode"; cat "$ins"; echo

          sel=$(mktemp)
          scode=$(curl -sS -o "$sel" -w '%{http_code}' \
            "$base/rest/v1/operators?select=id&id=eq.$uid" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $tok")
          echo "SELECT operators (role resolution) -> HTTP $scode"; cat "$sel"; echo

          svc=$(mktemp)
          vcode=$(curl -sS -o "$svc" -w '%{http_code}' \
            "$base/rest/v1/service_types?select=name&operator_id=eq.$uid" \
            -H "apikey: $ANON_KEY" -H "Authorization: Bearer $tok")
          echo "SELECT service_types (seed trigger) -> HTTP $vcode"; cat "$svc"; echo

          # Assert the seed trigger created BOTH default service types, not
          # just that the query returned 200.
          seeded=$(jq 'length' "$svc")
          [ "$icode" = "201" ] && [ "$scode" = "200" ] && grep -q "$uid" "$sel" \
            && [ "$vcode" = "200" ] && [ "$seeded" -eq 2 ]

      - name: Replay invite-claim flow (fixture operator + client)
        run: |
          base="https://${{ secrets.SUPABASE_PROJECT_REF }}.supabase.co"
          # Run-scoped, for the reason given in the onboard step above.
          op_email="diag-claim-op-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@sanpo.test"
          cl_email="diag-claim-client-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@sanpo.test"
          pass="Diag-$(date +%s)-pw"
          # admin, user_id_for, del, delete_operator, create_user, sign_in,
          # purge_client, erase_client. Each rule in them was learnt here one
          # failure at a time; they are shared with the onboard replay now, and
          # driven against a stub by app/scripts/staging-fixtures.test.ts.
          . scripts/staging-fixtures.sh
          # The teardown, pass or fail. The client goes the way the product
          # erases one, because nothing else can remove it once it has claimed:
          # erase_client in the library says why. It purges again after the
          # replay's own erasure below. The purge is idempotent, and purging
          # here too means a run that fails before that point still cleans up.
          # Reads the variables below, set as each fixture comes into being.
          cleanup() {
            erase_client "$op_email" "$pass" "$client_row"
            delete_operator "$op_uid"
            [ -n "$cl_uid" ] && del "$base/auth/v1/admin/users/$cl_uid" "auth user $cl_uid"
            return 0
          }
          # No sweep for a previous run's leftovers. It searched for this
          # run's addresses, which no earlier run can have used, so it paged
          # through every auth user in staging twice per run to find nothing,
          # and it could not have purged what it found without that run's
          # password.
          op_uid=""; client_row=""; cl_uid=""
          trap cleanup EXIT
          op_uid=$(create_user "$op_email" "$pass") || exit 1

          admin -X POST "$base/rest/v1/operators" -H "Content-Type: application/json" \
            -d "{\"id\":\"$op_uid\",\"business_name\":\"Diag Claim Walks\",\"display_name\":\"Diag\",\"email\":\"$op_email\"}" >/dev/null

          created=$(admin -X POST "$base/rest/v1/clients" -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d "{\"operator_id\":\"$op_uid\",\"full_name\":\"Diag Client\",\"email\":\"$cl_email\"}")
          client_row=$(echo "$created" | jq -r '.[0].id // empty')
          invite=$(echo "$created" | jq -r '.[0].invite_token // empty')
          [ -n "$invite" ] || { echo "FAIL: no invite token: $created"; exit 1; }

          # The account is created by the PUBLIC claim-signup function now (review
          # H31) — the replay exercises the real product path, which is the
          # only path that keeps working once the owner turns the GoTrue
          # signup toggle off. First the negative: a dead token must refuse
          # with its outcome BEFORE any account exists, because that ordering
          # is the function's entire security property.
          neg=$(mktemp); ncode=$(curl -sS -o "$neg" -w '%{http_code}' -X POST \
            "$base/functions/v1/claim-signup" -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"00000000-0000-4000-8000-00000000dead\",\"email\":\"$cl_email\",\"password\":\"$pass\"}")
          echo "claim-signup (dead token) -> HTTP $ncode"; cat "$neg"; echo
          if [ "$ncode" != "409" ] || ! grep -q '"not_found"' "$neg"; then
            echo "FAIL: a dead invite token did not refuse as not_found"; exit 1
          fi
          # Assigned (not tested inline) so that if the refused signup DID
          # create an account, the EXIT trap holds its id and deletes it —
          # and a failed LOOKUP is its own loud failure, never "absent".
          cl_uid=$(user_id_for "$cl_email") \
            || { echo "FAIL: could not verify the refused signup created no account — the auth lookup itself failed"; exit 1; }
          if [ -n "$cl_uid" ]; then
            echo "FAIL: the refused signup created an account anyway"; exit 1
          fi

          cs=$(mktemp); cscode=$(curl -sS -o "$cs" -w '%{http_code}' -X POST \
            "$base/functions/v1/claim-signup" -H "apikey: $ANON_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"$invite\",\"email\":\"$cl_email\",\"password\":\"$pass\"}")
          echo "claim-signup -> HTTP $cscode"; cat "$cs"; echo
          if [ "$cscode" != "200" ]; then
            # A crash AFTER createUser can leave a half-created account behind
            # a non-200: give the EXIT trap the id so it can clean up.
            cl_uid=$(user_id_for "$cl_email") || true
            echo "FAIL: claim-signup refused a live invite"; exit 1
          fi
          cl_uid=$(user_id_for "$cl_email") \
            || { echo "FAIL: claim-signup reported success but the auth lookup failed — cannot verify the account"; exit 1; }
          [ -n "$cl_uid" ] || { echo "FAIL: claim-signup reported success but created no account"; exit 1; }
          # The function creates the account unconfirmed (typing an address
          # proves nothing — the frontend resends the confirmation email).
          # CI has no inbox, so the admin API stands in for clicking the link;
          # everything before this line went through the public path. The PUT
          # is newly load-bearing (pre-H31 the create itself confirmed), so
          # its failure is named HERE rather than surfacing two lines later
          # as a bare sign-in failure.
          conf=$(mktemp)
          confcode=$(admin -o "$conf" -w '%{http_code}' -X PUT "$base/auth/v1/admin/users/$cl_uid" \
            -H "Content-Type: application/json" -d '{"email_confirm":true}')
          case "$confcode" in
            2*) ;;
            *) echo "FAIL: could not confirm the fixture email: HTTP $confcode — $(jq -r '.error_description // .msg // .message // "no message"' "$conf")"; exit 1 ;;
          esac
          tokbody=$(mktemp)
          tokcode=$(curl -sS -o "$tokbody" -w '%{http_code}' -X POST "$base/auth/v1/token?grant_type=password" \
            -H "apikey: $ANON_KEY" -H "Content-Type: application/json" \
            -d "{\"email\":\"$cl_email\",\"password\":\"$pass\"}")
          tok=$(jq -r '.access_token // empty' "$tokbody")
          [ -n "$tok" ] || { echo "FAIL: client sign-in: HTTP $tokcode — $(jq -r '.error_description // .msg // .message // "no message"' "$tokbody")"; exit 1; }
          echo "::add-mask::$tok"
          as_client() { curl -sS -H "apikey: $ANON_KEY" -H "Authorization: Bearer $tok" "$@"; }

          prev=$(mktemp); pcode=$(as_client -o "$prev" -w '%{http_code}' -X POST \
            "$base/rest/v1/rpc/fn_preview_invite" -H "Content-Type: application/json" \
            -d "{\"p_token\":\"$invite\"}")
          echo "fn_preview_invite -> HTTP $pcode"; cat "$prev"; echo

          clm=$(mktemp); ccode=$(as_client -o "$clm" -w '%{http_code}' -X POST \
            "$base/rest/v1/rpc/fn_claim_invite" -H "Content-Type: application/json" \
            -d "{\"p_token\":\"$invite\"}")
          echo "fn_claim_invite -> HTTP $ccode"; cat "$clm"; echo

          sel=$(mktemp); scode=$(as_client -o "$sel" -w '%{http_code}' \
            "$base/rest/v1/clients?select=id,status&auth_user_id=eq.$cl_uid")
          echo "SELECT clients (role resolution) -> HTTP $scode"; cat "$sel"; echo

          [ "$pcode" = "200" ] && [ "$ccode" -lt 300 ] && [ "$scode" = "200" ] && grep -q "$client_row" "$sel" \
            || { echo "FAIL: the claim did not bind the client to its account"; exit 1; }

          # Erase the client the way the product does (H5): fn_purge_client,
          # as its operator. This is the erasure's only run against a hosted
          # project, and it is what lets the teardown delete a claimed client
          # at all. So it is asserted here rather than left to the teardown,
          # where a failure would be one more warning.
          optok=$(sign_in "$op_email" "$pass") \
            || { echo "FAIL: the fixture operator could not sign in to erase its client"; exit 1; }
          echo "::add-mask::$optok"
          pg=$(mktemp); pgcode=$(purge_client "$optok" "$client_row" "$pg")
          echo "fn_purge_client -> HTTP $pgcode"; cat "$pg"; echo
          # An empty list: the purge returns the storage paths still to
          # delete, and this fixture uploads nothing.
          [ "$pgcode" = "200" ] && [ "$(jq -c . "$pg" 2>/dev/null)" = "[]" ] \
            || { echo "FAIL: the operator could not erase its client"; exit 1; }
          tomb=$(mktemp); tcode=$(admin -o "$tomb" -w '%{http_code}' \
            "$base/rest/v1/clients?select=purged_at,auth_user_id,email,full_name&id=eq.$client_row")
          echo "SELECT the erased client -> HTTP $tcode"; cat "$tomb"; echo
          [ "$tcode" = "200" ] \
            && jq -e 'length == 1 and (.[0] | .purged_at != null and .auth_user_id == null and .email == null and .full_name == "Deleted client")' "$tomb" >/dev/null \
            || { echo "FAIL: the purge did not leave a redacted tombstone"; exit 1; }
